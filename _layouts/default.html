<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="theme-color" content="#eaea5d">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body id="top">

  <div class="page">

    <header class="site-header">
      <a class="site-brand" href="{{ '/' | relative_url }}">
        <img class="brand-icon" src="{{ '/assets/images/brand/doespace-icon.png' | relative_url }}" alt="" aria-hidden="true">
        <span class="brand-text">
          <img class="brand-wordmark" src="{{ '/assets/images/brand/doespace-wordmark.png' | relative_url }}" alt="{{ site.title }}">
          <span class="brand-tagline">{{ site.tagline }}</span>
        </span>
      </a>

      <nav class="site-nav" aria-label="Main">
        <a href="{{ '/#top' | relative_url }}">Home</a>
        <a href="{{ '/funemployed-land/' | relative_url }}">Play</a>
        <a href="{{ '/blog/' | relative_url }}">Feel</a>
        <a href="{{ '/#comments' | relative_url }}">Comment</a>
      </nav>
    </header>

    {{ content }}

    <div class="site-footer">
      &copy; <span data-year>{{ site.time | date: '%Y' }}</span> {{ site.data.profile.display_name | default: 'Lain Doe' }} &middot;
      <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
    </div>

  </div>

  <a class="back-to-top" href="#top" id="back-to-top" hidden>
    <span class="visually-hidden">Back to top</span>
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M12 5.5 5 13h4.2v5.5h5.6V13H19z" fill="currentColor"/>
    </svg>
  </a>

  <script src="{{ '/assets/js/doespace.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>

</body>
</html>
